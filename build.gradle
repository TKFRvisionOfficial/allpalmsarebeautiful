plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = mod_group_id
version = mod_version
base.archivesName = "${mod_id}-forge-${minecraft_version}"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            // Remap dependency refmaps (e.g. TerraBlender) for development runs.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                allpalmsarebeautiful {
                    source sourceSets.main
                }
            }
        }
        client {
        }
        server {
        }
        data {
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

repositories {
    maven { url = 'https://maven.blamejared.com' }
    maven {
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("curse.maven:tropicraft-254794:${tropicraft_file}")
    runtimeOnly fg.deobf("curse.maven:oh-the-biomes-weve-gone-1070751:${biomes_weve_gone_file}")
    runtimeOnly fg.deobf("curse.maven:oh-the-trees-youll-grow-962544:${otty_file}")
    runtimeOnly fg.deobf("curse.maven:corgilib-693313:${corgilib_file}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    runtimeOnly fg.deobf("curse.maven:geckolib-388172:${geckolib_file}")
    runtimeOnly fg.deobf("curse.maven:terrablender-563928:${terrablender_file}")
}

// The development refmap settings above need this file even on a clean checkout.
tasks.matching { it.name in ['runClient', 'runServer', 'runData'] }.configureEach {
    dependsOn 'createSrgToMcp'
}

tasks.named('processResources', ProcessResources).configure {
    // Mixin's fallback refmap activates SRG remapping for refmapless dependencies.
    // Include it in the development classpath, then exclude it from our mod jar.
    from('src/development/resources') { include 'mixin.refmap.json' }
    def replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version_range: forge_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

jar {
    exclude 'mixin.refmap.json'
    manifest {
        attributes([
            'Specification-Title': mod_name,
            'Specification-Vendor': 'TKFRvision',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'TKFRvision',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) { artifact jar }
    }
    repositories {
        maven { url = "file://${project.projectDir}/mcmodsrepo" }
    }
}
